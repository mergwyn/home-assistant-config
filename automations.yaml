- id: '1770386039832'
  alias: 'Alert: Kitchen Wall Moisture Increase'
  description: Pings phone if wall moisture rises significantly above house baseline
  triggers:
  - entity_id: sensor.wall_moisture_delta
    above: 37
    for:
      hours: 1
      minutes: 0
      seconds: 0
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      title: ⚠️ Roof Leak Warning
      message: Wall moisture is {{ states('sensor.kitchen_roof_humidity') }}% - {{
        states('sensor.wall_moisture_delta') }}% higher than house average.
      data:
        priority: high
        clickAction: /lovelace/roof-stats
    action: notify.mobile_app_iphone
  mode: single
- id: '1770386453824'
  alias: 'Status: Wall Officially Dry'
  description: Notify when wall moisture hits stable dry levels
  triggers:
  - entity_id: sensor.kitchen_roof_humidity
    below: 5
    for:
      hours: 24
    trigger: numeric_state
  actions:
  - data:
      title: ✅ Wall is Dry
      message: Great news! The roof wall has stayed at {{ states('sensor.kitchen_roof_humidity')
        }}% for 24 hours. The drying process is complete.
    action: notify.mobile_app_iphone
  mode: single
- id: '1770973335482'
  alias: Bins out tonight
  description: ''
  triggers:
  - at: '18:00:00'
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ ''tomorrow'' in states(''sensor.next_bin_summary'') | lower
      }}'
  actions:
  - data:
      title: "\U0001F69B Bin Reminder"
      message: It's {{ states('sensor.next_bin_summary') }}. Don't forget to put them
        out!
    action: notify.all_devices
  - data:
      title: "\U0001F69B Bin Reminder"
      message: It's {{ states('sensor.next_bin_summary') }}. Don't forget to put them
        out!
      data:
        push:
          sound: default
    action: notify.mobile_app_iphone
- id: '1770984331192'
  alias: 'Roof Alert: High Moisture + Heavy Rain Forecast'
  description: Alerts if roof is wet and heavy rain (>25mm) is predicted today.
  triggers:
  - at: 07:00:00
    trigger: time
  conditions:
  - condition: numeric_state
    entity_id: sensor.kitchen_roof_humidity
    above: 85
  actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.home
    response_variable: daily_forecast
  - if:
    - condition: template
      value_template: '{{ daily_forecast[''weather.home''].forecast[0].precipitation
        | float(0) > 25 }}

        '
    then:
    - action: notify.mobile_app_iphone
      data:
        title: ⚠️ Roof Ingress Risk
        message: 'Roof moisture is high ({{ states(''sensor.kitchen_roof_humidity'')
          }}%).  Heavy rain ({{ daily_forecast[''weather.home''].forecast[0].precipitation
          }}mm)  is forecast for today.

          '
        data:
          push:
            sound: US-EN-Morgan-Freeman-Severe-Weather-Update.wav
- id: '1778396224039'
  alias: IOG Boost on EV Plug-In
  description: Sets IOG charge target based on delta between current and target SoC
  triggers:
  - entity_id:
    - sensor.myenergi_zappi_24876502_plug_status
    to:
    - EV Connected
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 20
  conditions:
  - condition: template
    value_template: "{{ states('sensor.my_id3_battery_level') | float(0) <\n   states('number.my_id3_battery_target_charge_level')
      | float(80) }}\n"
  actions:
  - variables:
      soc_current: '{{ states(''sensor.my_id3_battery_level'') | float(0) }}'
      soc_target: '{{ states(''number.my_id3_battery_target_charge_level'') | float(80)
        }}'
      boost_value: '{{ [[soc_target - soc_current, 10] | max, 100] | min | round(0)
        | int }}

        '
  - target:
      entity_id: number.octopus_energy_00000000_0009_4000_8020_000000085d8c_intelligent_charge_target
    data:
      value: '{{ boost_value }}'
    action: number.set_value
  - data:
      title: IOG Boost Set
      message: 'SoC: {{ soc_current }}% → Target: {{ soc_target }}%. Boost set to
        {{ boost_value }}%.

        '
    action: notify.mobile_app_iphone
