- id: '1738660541500'
  alias: Cheap rate hot water boost
  description: ''
  triggers:
  - trigger: state
    id: Hot Water On
    entity_id:
    - binary_sensor.target_timeframes_octopus_energy_import_hot_water_nightly
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    id: Hot Water Off
    entity_id:
    - binary_sensor.target_timeframes_octopus_energy_import_hot_water_nightly
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    id: Hot Water On
    entity_id:
    - input_boolean.hot_water_boost
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - trigger: state
    id: Hot Water Off
    entity_id:
    - input_boolean.hot_water_boost
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 2
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Hot Water On
      sequence:
      - action: script.set_climate
        metadata: {}
        data:
          climate: '{{ climate }}'
          temperature: '{{ boost_temp | float}}'
      - action: input_boolean.turn_on
        enabled: false
        target:
          entity_id: input_boolean.hot_water_boost
    - conditions:
      - condition: trigger
        id:
        - Hot Water Off
      sequence:
      - action: script.set_climate
        metadata: {}
        data:
          climate: '{{ climate }}'
          temperature: '{{ day_temp | float}}'
      - action: input_boolean.turn_off
        enabled: false
        target:
          entity_id: input_boolean.hot_water_boost
  variables:
    climate: m5atom_dev_hot_water
    min_temp: 30
    max_temp: 55
    legionella: '{{ states(''input_number.dhw_legionella'') | float }}'
    default_boost: '{{ states(''input_number.dhw_boost'') | float }}'
    holiday: '{{ states(''input_number.dhw_holiday_temp'') | float }}'
    setback: '{{ states(''input_number.dhw_setback'') | float }}'
    holiday_mode: '{{ states(''binary_sensor.holiday_mode'') | bool }}'
    boost_temp: '{%- if holiday_mode -%} {{ holiday |float }} {% elif (now().weekday()
      == 2) %} {{ legionella | float }} {% else %}  {{ default_boost | float}} {%
      endif %}

      '
    day_temp: '{%- if holiday_mode -%} {{ holiday |float }}

      {% else %} {{ [( default_boost - setback ),  min_temp ] | max | float}}

      {% endif %}

      '
  mode: single
