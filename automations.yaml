- id: Car_not_plugged_in_at_bedtime
  alias: 'Car not plugged in at bedtime '
  triggers:
  - at: '21:00:00'
    trigger: time
  conditions:
  - condition: state
    state:
    - 'off'
    entity_id: binary_sensor.my_id3_charging_cable_connected
  - condition: numeric_state
    entity_id: sensor.my_id3_battery_level
    below: 60
    enabled: true
  - condition: state
    entity_id: device_tracker.my_id3_position
    state:
    - home
    for:
      hours: 0
      minutes: 5
      seconds: 0
  actions:
  - data:
      message: Car is below 60% and not plugged in to charge
    action: notify.all_devices
  mode: single
- id: '1689698354261'
  alias: Solcast_update
  description: New API call Solcast
  trigger:
  - platform: time_pattern
    minutes: '7'
    seconds: '33'
    hours: /3
  condition: []
  action:
  - delay:
      seconds: '{{ range(30, 360)|random|int }}'
  - service: solcast_solar.update_forecasts
    data: {}
  mode: single
- id: '1690125172197'
  alias: Start solar charge
  description: ''
  trigger:
  - platform: state
    entity_id:
    - device_tracker.my_id_3_tracker
    to: home
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - platform: time
    at: 09:00:00
  - platform: numeric_state
    entity_id: sensor.solis_remaining_battery_capacity
    above: 98
  condition:
  - condition: sun
    before: sunset
    after: sunrise
  - condition: numeric_state
    entity_id: sensor.my_id_3_state_of_charge
    below: 80
  - condition: numeric_state
    entity_id: sensor.forecast_remaining_today
    above: 3
  - condition: numeric_state
    entity_id: sensor.solis_remaining_battery_capacity
    above: 95
  - condition: state
    entity_id: device_tracker.my_id_3_tracker
    state: home
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.my_id_3_charging_state
      state: charging
  action:
  - if:
    - condition: state
      entity_id: sensor.my_id_3_plug_connection_state
      state: connected
    then:
    - service: button.press
      data: {}
      target:
        entity_id: button.my_id_3_start_charging
    - service: notify.all_devices
      data:
        message: Auto charging started (car:{{ states('sensor.my_id_3_state_of_charge')
          }}%, battery:{{states('sensor.solis_remaining_battery_capacity')}}%, remaining
          forecast:{{states('sensor.forecast_remaining_today')}}kWh)"
    else:
    - service: notify.all_devices
      data:
        message: Good solar forecast but car not plugged in (car:{{ states('sensor.my_id_3_state_of_charge')
          }}%, battery:{{states('sensor.solis_remaining_battery_capacity')}}%, remaining
          forecast:{{states('sensor.forecast_remaining_today')}}kWh)"
  mode: single
- id: '1690213949634'
  alias: Stop solar charge
  description: ''
  trigger:
  - platform: numeric_state
    entity_id: sensor.solis_remaining_battery_capacity
    below: 95
  - platform: numeric_state
    entity_id: sensor.forecast_remaining_today
    below: 2
  condition:
  - condition: numeric_state
    entity_id: sensor.solis_remaining_battery_capacity
    below: 95
  - condition: state
    entity_id: device_tracker.my_id_3_tracker
    state: home
  - condition: state
    entity_id: sensor.my_id_3_charging_state
    state: charging
  - condition: sun
    before: sunset
    after: sunrise
  action:
  - service: notify.all_devices
    data:
      message: Auto charging stopped (car:{{ states('sensor.my_id_3_state_of_charge')
        }}%, battery:{{states('sensor.solis_remaining_battery_capacity')}}%, remaining
        forecast:{{states('sensor.forecast_remaining_today')}}kWh)
  - service: button.press
    data: {}
    target:
      entity_id: button.my_id_3_stop_charging
  mode: single
- id: '1695742406464'
  alias: 'AutoBackup: Daily Backup'
  description: ''
  trigger:
    platform: time
    at: 02:30:00
  condition:
    condition: time
    weekday:
    - tue
    - wed
    - thu
