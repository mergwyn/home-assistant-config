- id: '1765368696331'
  alias: Calibrate thermostat on change
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.office_external_temperature
    id: office
    for:
      minutes: 2
    variables:
      thermostat: climate.office_thermostat
      calibration: number.office_thermostat_local_temperature_calibration
      sensor_extern: sensor.office_external_temperature
  - trigger: state
    entity_id:
    - sensor.living_room_external_temperature
    id: living room
    for:
      minutes: 2
    variables:
      thermostat: climate.living_room_thermostat
      calibration: number.living_room_thermostat_local_temperature_calibration
      sensor_extern: sensor.living_room_external_temperature
  - trigger: state
    entity_id:
    - sensor.family_room_external_temperature
    id: family room
    for:
      minutes: 2
    variables:
      thermostat: climate.family_room_thermostat
      calibration: number.family_room_thermostat_local_temperature_calibration
      sensor_extern: sensor.family_room_external_temperature
  - trigger: state
    entity_id:
    - sensor.hall_external_temperature
    id: hall
    for:
      minutes: 2
    variables:
      thermostat: climate.hall_thermostat
      calibration: number.hall_thermostat_local_temperature_calibration
      sensor_extern: sensor.hall_external_temperature
  - trigger: state
    entity_id:
    - sensor.main_bedroom_temperature
    id: bedroom
    for:
      minutes: 2
    variables:
      thermostat: climate.landing_thermostat
      calibration: number.landing_thermostat_local_temperature_calibration
      sensor_extern: sensor.main_bedroom_temperature
  conditions: []
  actions:
  - action: script.calibrate_thermostat_from_external_sensor
    metadata: {}
    data:
      thermostat: '{{ thermostat }}'
      calibration: '{{ calibration }}'
      sensor_extern: '{{ sensor_extern }}'
  mode: queued
  trace:
    stored_traces: 20
- id: '1765376622934'
  alias: Calibrate thermostat periodic
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions: []
  actions:
  - condition: template
    value_template: "{{ not states(sensor_extern) in ['unavailable', 'unknown', 'none']\n
      \  and not states(thermostat) in ['unavailable', 'unknown', 'none']\n   and
      not states(calibration) in ['unavailable', 'unknown', 'none'] }}"
  - repeat:
      for_each:
      - thermostat: climate.living_room_thermostat
        calibration: number.living_room_thermostat_local_temperature_calibration
        sensor_extern: sensor.living_room_external_temperature
      - thermostat: climate.family_room_thermostat
        calibration: number.family_room_thermostat_local_temperature_calibration
        sensor_extern: sensor.family_room_external_temperature
      - thermostat: climate.office_thermostat
        calibration: number.office_thermostat_local_temperature_calibration
        sensor_extern: sensor.office_external_temperature
      - thermostat: climate.hall_thermostat
        calibration: number.hall_thermostat_local_temperature_calibration
        sensor_extern: sensor.hall_external_temperature
      - thermostat: climate.landing_thermostat
        calibration: number.landing_thermostat_local_temperature_calibration
        sensor_extern: sensor.main_bedroom_temperature
      sequence:
      - action: script.calibrate_thermostat_from_external_sensor
        metadata: {}
        data:
          thermostat: '{{ repeat.item.thermostat }}'
          calibration: '{{ repeat.item.calibration }}'
          sensor_extern: '{{ repeat.item.sensor_extern }}'
  mode: queued
- id: '1765617311695'
  alias: Cheap rate heating boost
  description: ''
  triggers:
  - trigger: state
    id: Boost On
    entity_id:
    - binary_sensor.target_timeframes_octopus_energy_import_heating_overnight_boost
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    id: Boost Off
    entity_id:
    - binary_sensor.target_timeframes_octopus_energy_import_heating_overnight_boost
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    id: Boost On
    entity_id:
    - input_boolean.heating_boost
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - trigger: state
    id: Boost Off
    entity_id:
    - input_boolean.heating_boost
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions:
  - condition: template
    enabled: false
    value_template: '{{ (not holiday_mode) and (states(''sensor.m5atom_dev_outdoor_temperature'')
      | float < 10) }}

      '
  - condition: state
    entity_id: binary_sensor.holiday_mode
    state:
    - 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Boost On
      sequence:
      - action: script.set_climate
        enabled: true
        metadata: {}
        data:
          climate: downstairs
          temperature: '{{ downstairs_boost | float}}'
      - action: script.set_climate
        enabled: false
        metadata: {}
        data:
          climate: landing_thermostat
          temperature: '{{ upstairs_comfort | float}}'
      - action: input_boolean.turn_on
        enabled: false
        target:
          entity_id: input_boolean.heating_boost
    - conditions:
      - condition: trigger
        id:
        - Boost Off
      sequence:
      - action: script.set_climate
        enabled: true
        metadata: {}
        data:
          climate: downstairs
          temperature: '{{ downstairs_comfort | float}}'
      - action: script.set_climate
        enabled: false
        metadata: {}
        data:
          climate: landing_thermostat
          temperature: '{{ upstairs_comfort | float}}'
      - action: input_boolean.turn_off
        enabled: false
        target:
          entity_id: input_boolean.heating_boost
  mode: single
  variables:
    climate: m5atom_dev_hot_water
    holiday_temp: 10
    holiday_mode: '{{ states(''binary_sensor.holiday_mode'') | bool }}'
    downstairs_boost: '{{ holiday_temp if holiday_mode else states(''input_number.downstairs_boost'')
      | float }}'
    downstairs_comfort: '{{ holiday_temp if holiday_mode else states(''input_number.downstairs_comfort'')
      | float }}'
    upstairs_boost: '{{ holiday_temp if holiday_mode else states(''input_number.landing_thermostat_boost'')
      | float }}'
    upstairs_comfort: '{{ holiday_temp if holiday_mode else states(''input_number.landing_thermostat_comfort'')
      | float }}'
