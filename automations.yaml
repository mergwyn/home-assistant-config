- id: '1702282466295'
  alias: Check car ready for charging
  description: ''
  triggers:
  - at: '21:00:00'
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        state: ReadyForCharging
        entity_id: sensor.my_volkswagen_charging_state
        for:
          hours: 0
          minutes: 2
          seconds: 0
    - condition: not
