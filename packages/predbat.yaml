---
# yamllint disable rule:line-length
# Helpers to support the prebat package. These are not intended to be used directly.

template:
  - trigger:
      - platform: state
        entity_id: sensor.ashp_clamp_energy
    sensor:
      - name: "ASHP DHW energy"
        unique_id: ashp_dhw_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set clamp = states('sensor.ashp_clamp_energy') | float(0) %}
          {% set previous = this.attributes.get('last_clamp', clamp) | float(0) %}
          {% set delta = clamp - previous %}
          {% set dhw = states('sensor.samsung_ashp_dhw_status') | float(-1) %}
          {% if delta < 0 %}{% set delta = 0 %}{% endif %}
          {{ (this.state | float(0)) + (delta if (dhw > 0.5) else 0) }}
        attributes:
          last_clamp: "{{ states('sensor.ashp_clamp_energy') | float(0) }}"

  - trigger:
      - platform: state
        entity_id: sensor.ashp_clamp_energy
    sensor:
      - name: "ASHP Heating energy"
        unique_id: ashp_heating_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set clamp = states('sensor.ashp_clamp_energy') | float(0) %}
          {% set previous = this.attributes.get('last_clamp', clamp) | float(0) %}
          {% set delta = clamp - previous %}
          {% if delta < 0 %}{% set delta = 0 %}{% endif %}
          {% set dhw = states('sensor.samsung_ashp_dhw_status') | float(-1) %}
          {{ (this.state | float(0)) + (delta if (0 <= dhw <= 0.5) else 0) }}
        attributes:
          last_clamp: "{{ states('sensor.ashp_clamp_energy') | float(0) }}"

  - sensor:
      - name: "Solax battery power signed"
        unique_id: solax_battery_power_signed
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{ states('sensor.solax_battery_output_energy') | float(0)
             - states('sensor.solax_battery_input_energy') | float(0) }}

      - name: "Solax timed charge start"
        unique_id: solax_timed_charge_start
        state: >-
          {{ '%02d:%02d:00' | format(states('number.solax_timed_charge_start_hours') | int(0),
                                      states('number.solax_timed_charge_start_minutes') | int(0)) }}
      - name: "Solax timed charge end"
        unique_id: solax_timed_charge_end
        state: >-
          {{ '%02d:%02d:00' | format(states('number.solax_timed_charge_end_hours') | int(0),
                                      states('number.solax_timed_charge_end_minutes') | int(0)) }}
      - name: "Solax timed discharge start"
        unique_id: solax_timed_discharge_start
        state: >-
          {{ '%02d:%02d:00' | format(states('number.solax_timed_discharge_start_hours') | int(0),
                                      states('number.solax_timed_discharge_start_minutes') | int(0)) }}
      - name: "Solax timed discharge end"
        unique_id: solax_timed_discharge_end
        state: >-
          {{ '%02d:%02d:00' | format(states('number.solax_timed_discharge_end_hours') | int(0),
                                      states('number.solax_timed_discharge_end_minutes') | int(0)) }}
