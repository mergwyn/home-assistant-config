# BATTERY CHARGE CONTROL PACKAGE
# For SolaX + Predbat setups
# Aims to limit battery charging to avoid overcharging and reduce battery wear,
# while still allowing full charging when solar is abundant.

input_boolean:
  allow_full_charge:
    name: Allow Full Battery Charge
    icon: mdi:battery-charging-100

automation:

  - alias: Battery - Smart Charge Current Control
    id: battery_smart_charge_control
    mode: single

    trigger:
      - platform: time_pattern
        minutes: /5

    variables:
      remaining_solar: "{{ states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) }}"
      soc: "{{ states('sensor.solax_battery_soc') | float(0) }}"
      capacity: 10  # 🔧 CHANGE if your usable battery size differs (kWh)
      energy_needed: "{{ (95 - soc) / 100 * capacity }}"

    action:

      - choose:
          # LOW SOLAR → charge normally (don’t restrict)
          - conditions:
              - condition: template
                value_template: "{{ remaining_solar < energy_needed }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.allow_full_charge

              - service: number.set_value
                target:
                  entity_id: number.solax_battery_charge_current
                data:
                  value: 80   # 🔧 Your inverter max

          # NORMAL DAY → limit morning charging
          - conditions:
              - condition: time
                before: "14:30:00"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.allow_full_charge

              - service: number.set_value
                target:
                  entity_id: number.solax_battery_charge_current
                data:
                  value: 15   # 🔧 Tune this (10–25 typical)

        # AFTERNOON → allow full charging
        default:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.allow_full_charge

          - service: number.set_value
            target:
              entity_id: number.solax_battery_charge_current
            data:
              value: 80

  - alias: Battery - Optional Temperature Protection
    id: battery_temp_protection
    mode: single

    trigger:
      - platform: time_pattern
        minutes: /5

    condition:
      - condition: numeric_state
        entity_id: sensor.solar_battery_rack_temperature
        above: 28

    action:
      - service: number.set_value
        target:
          entity_id: number.solax_battery_charge_current
        data:
          value: 10   # Slow charging when hot
