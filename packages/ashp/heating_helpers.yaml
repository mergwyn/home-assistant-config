# ---
template:
  - binary_sensor:
    - name: Upstairs Heating Active
      unique_id: template_binary_sensor_upstairs_heating_active
      icon: mdi:toggle-switch
      availability: >
        {{
        states("sensor.ashp_rad_circuits_calling") != "unavailable"
        and states("sensor.ashp_rad_circuits_calling") != "unknown"
        }}
      state: >
        {{ states("sensor.ashp_rad_circuits_calling") > 0 }}

  - binary_sensor:
    - name: Only Upstairs Heating Active
      unique_id: template_binary_sensor_only_upstairs_heating_active
      icon: mdi:toggle-switch
      availability: >
        {{
        states("sensor.ashp_rad_circuits_calling") != "unavailable"
        and states("sensor.ashp_rad_circuits_calling") != "unknown"
        and states("sensor.ashp_ufh_circuits_calling") != "unavailable"
        and states("sensor.ashp_ufh_circuits_calling") != "unknown"
        }}
      state: >
        {{ states("sensor.ashp_rad_circuits_calling") > 0
        and states("sensor.ashp_ufh_circuits_calling") == 0 }}

  - binary_sensor:
    - name: "ASHP space heating active"
      unique_id: template_binary_sensor_ashp_space_heating_active
      device_class: heat
      state: "{{ states('sensor.m5atom_dev_zone_heating_status') | float(0) > 0 }}"

  - sensor:
      - name: "Downstairs target temperature"
        unique_id: template_sensor_downstairs_target_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer
        state: "{{ state_attr('climate.downstairs', 'temperature') }}"
        availability: "{{ state_attr('climate.downstairs', 'temperature') is not none }}"

  - sensor:
      - name: Downstairs Average Temperature
        unique_id: template_sensor_downstairs_average_temperature
        unit_of_measurement: °C
        device_class: temperature
        state: "{{ state_attr('climate.downstairs', 'current_temperature') | float(0) }}"
      - name: Downstairs Average Humidity
        unique_id: downstairs_average_humidity
        unit_of_measurement: '%'
        device_class: humidity
        state: "{{ state_attr('climate.downstairs', 'current_humidity') | float(0) }}"

  - sensor:
    - name: ASHP Total Energy Consumed Adjusted
      unique_id: template_sensor_total_energy_consumed_adjusted
      state_class: total_increasing
      device_class: energy
      unit_of_measurement: kWh
      availability: >
        {{ states("sensor.ashp_clamp_energy") != "unavailable"
        and states("sensor.ashp_clamp_energy") != "unknown" }}
      state: >
        {{ (states('sensor.ashp_clamp_energy') | float(0) - 604.930 + 13254.418) | float(0) }}

  - sensor:
    - name: ASHP COP - Daily Clamp
      unique_id: template_sensor_cop_daily_clamp
      state_class: measurement
      icon: mdi:chart-bar
      state: >
        {% set generated = states('sensor.m5atom_dev_daily_heat_generated') | float(0) %}
        {% set consumed = states('sensor.ashp_daily_energy_consumed_clamp') | float(0) %}
        {% if generated == 0 or consumed == 0 -%}{{ float(0) }}{% else -%}
        {{ [generated / consumed, 8] | min | round(2) | float(0)}}
        {% endif -%}

  - sensor:
    - name: ASHP COP - Last Hour Clamp
      unique_id: template_sensor_cop_last_hour
      state_class: measurement
      icon: mdi:chart-bar
      state: >
        {% set generated = states('sensor.ashp_last_hour_heat_produced_esp') | float(0) %}
        {% set consumed = states('sensor.ashp_last_hour_energy_consumed_clamp') | float(0) %}
        {% if generated == 0 or consumed == 0 -%}0{% else -%}
        {{ [generated / consumed, 8] | min | round(2) | float(0)}}
        {% endif -%}

  - sensor:
    - name: ASHP COP - Last Minute Clamp
      unique_id: template_sensor_cop_last_min
      state_class: measurement
      icon: mdi:chart-bar
      state: >
        {% set generated = states('sensor.m5atom_dev_last_minute_heat_generated') | float(0) %}
        {% set consumed = states('sensor.ashp_power_consumed_last_minute_clamp') | float(0) %}
        {% if generated == 0 or consumed == 0 -%}0{% else -%}
        {{ [generated / consumed, 8] | min | round(2) | float(0)}}
        {% endif -%}

  - sensor:
    - name: ASHP COP - Total
      unique_id: template_sensor_cop_total
      state_class: measurement
      icon: mdi:chart-bar
      state: >
        {% set generated = states('sensor.m5atom_dev_total_produced_energy') | float(0) %}
        {% set consumed = states('sensor.ashp_total_energy_consumed_adjusted') | float(0) %}
        {% if generated == 0 or consumed == 0 -%}0{% else -%}
        {{ [generated / consumed, 8] | min | round(2) | float(0)}}
        {% endif -%}

