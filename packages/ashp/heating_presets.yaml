---
# packages/heating_helpers.yaml
input_number:
  downstairs_boost:
    name: Downstairs Boost Temperature
    min: 7
    max: 30
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:thermometer-plus
  downstairs_comfort:
    name: Downstairs Comfort Temperature
    min: 7
    max: 30
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:thermometer
  downstairs_eco:
    name: Downstairs Eco Temperature
    min: 7
    max: 30
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:leaf

  landing_thermostat_boost:
    name: Upstairs Boost Temperature
    min: 7
    max: 30
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:thermometer-plus
  landing_thermostat_comfort:
    name: Upstairs Comfort Temperature
    min: 7
    max: 30
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:thermometer
  landing_thermostat_eco:
    name: Upstairs Eco Temperature
    min: 7
    max: 30
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:leaf

  dhw_boost:
    name: DHW Boost Temperature
    min: 30
    max: 60
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:thermometer-plus
  dhw_legionella:
    name: DHW Legionella Temperature
    min: 30
    max: 60
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:bottle-tonic-skull
  dhw_holiday_temp:
    name: DHW Holiday Temperature
    min: 30
    max: 60
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:water-hermometer
  dhw_setback:
    name: DHW Setback Temperature
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:temperature-celsius

automation:
  - alias: Initialise Heating Helper Defaults
    triggers:
      - trigger: homeassistant
        event: start
    variables:
      defaults:
        input_number.downstairs_boost: 22.5
        input_number.downstairs_comfort: 21
        input_number.downstairs_eco: 19
        input_number.landing_thermostat_boost: 20.5
        input_number.landing_thermostat_comfort: 19
        input_number.landing_thermostat_eco: 17.5
        input_number.dhw_boost: 47.5
        input_number.dhw_legionella: 55
        input_number.dhw_holiday_temp: 30
        input_number.dhw_setback: 5.5
    actions:
      - repeat:
          for_each: "{{ defaults | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item) in ['unknown', 'unavailable'] }}"
              then:
                - action: input_number.set_value
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: "{{ defaults[repeat.item] }}"
