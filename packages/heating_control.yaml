---
# yamllint disable rule:line-length
# packages/heating_control.yaml
template:
  - triggers:
      - trigger: state
        entity_id: &boost binary_sensor.target_timeframes_octopus_energy_import_heating_daytime_boost
        to: "on"
        id: start
      - trigger: state
        entity_id: *boost
        to: "off"
        id: stop
    binary_sensor:
      - name: "Rolling target outside cheap slot"
        unique_id: rolling_target_outside_cheap_slot
        device_class: running
        state: >
          {% if trigger.id == 'start' %}
            {% set t = now().strftime('%H:%M') %}
            {{ '05:30' <= t < '23:30' }}
          {% else %}
            false
          {% endif %}

  - binary_sensor:
      - name: "Octopus power up active"
        unique_id: octopus_power_up_active
        state: "{{ is_state('calendar.octopus_energy_a_281ee75f_octoplus_power_up', 'on') }}"

      - name: "IOG extra dispatch outside cheap slot"
        unique_id: iog_extra_dispatch_outside_cheap_slot
        device_class: running
        state: >
          {% set t = now().strftime('%H:%M') %}
          {{ is_state('binary_sensor.octopus_energy_00000000_0002_4000_8020_000000106d40_intelligent_dispatching', 'on')
             and '05:30' <= t < '23:30' }}

      - name: "Octopus heating boost active"
        unique_id: octopus_heating_boost_active
        state: "{{ is_state('binary_sensor.target_timeframes_octopus_energy_import_heating_overnight_boost', 'on')
                  or is_state('binary_sensor.rolling_target_outside_cheap_slot', 'on') }}"

      - name: DHW boost active
        unique_id: dhw_boost_active
        state: >
          {{ is_state('binary_sensor.target_timeframes_octopus_energy_import_hot_water_nightly', 'on')
             or is_state('timer.dhw_boost', 'active')
             or is_state('binary_sensor.octopus_power_up_active', 'on') }}

  - sensor:
      - name: "Heating upstairs mode"
        unique_id: heating_upstairs_mode
        state: >
          {% if is_state('schedule.heating_up_boost', 'on')
             or is_state('binary_sensor.octopus_power_up_active', 'on')
             or is_state('timer.heating_boost', 'active') %}boost
          {% elif is_state('schedule.heating_up_eco', 'on') %}eco
          {% else %}comfort{% endif %}

schedule:
  # The boost and eco times need to match.
  # All others times default to comfort
  heating_up_boost:
    name: Heating upstairs boost
    monday: &boost_up
      - {from: "07:00:00", to: "08:00:00"}
      - {from: "21:30:00", to: "22:30:00"}
    tuesday: *boost_up
    wednesday: *boost_up
    thursday: *boost_up
    friday: *boost_up
    saturday: *boost_up
    sunday: *boost_up
  heating_up_eco:
    name: Heating upstairs eco
    monday: &eco_up
      - {from: "00:00:00", to: "07:00:00"}
      - {from: "22:30:00", to: "24:00:00"}
    tuesday: *eco_up
    wednesday: *eco_up
    thursday: *eco_up
    friday: *eco_up
    saturday: *eco_up
    sunday: *eco_up

timer:
  heating_boost:
    name: Heating boost
    duration: "01:00:00"
    restore: true
  dhw_boost:
    name: DHW boost
    duration: "01:00:00"
    restore: true

automation:
  - id: heating_downstairs_boost
    alias: Downstairs heating boost
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.octopus_heating_boost_active
        to: ["on", "off"]
        for: "00:01:00"
      - trigger: state
        entity_id: binary_sensor.octopus_power_up_active
        to: ["on", "off"]
        for: "00:01:00"
      - trigger: state
        entity_id: timer.heating_boost
        to: ["active", "idle"]
      - trigger: homeassistant
        event: start
    conditions:
      - alias: Skip while the target sensor is unavailable
        condition: template
        value_template: >
          {{ states('binary_sensor.octopus_heating_boost_active')
             in ['on', 'off'] }}
    variables:
      boost_wanted: >
        {{ is_state('binary_sensor.octopus_heating_boost_active', 'on')
           or is_state('binary_sensor.octopus_power_up_active', 'on')
           or is_state('timer.heating_boost', 'active') }}
      boost_temp: "{{ states('input_number.downstairs_boost') | float }}"
      comfort_temp: "{{ states('input_number.downstairs_comfort') | float }}"
    actions:
      - action: logbook.log
        data:
          name: Heating boost
          message: >
            wanted={{ boost_wanted }}
            target={{ is_state('binary_sensor.octopus_heating_boost_active', 'on') }}
            calendar={{ is_state('binary_sensor.octopus_power_up_active', 'on') }}
            timer={{ is_state('timer.heating_boost', 'active') }}
          # entity_id: "{{ climate }}"
      - action: script.update_climate
        data:
          climate: downstairs
          temperature: "{{ boost_temp if boost_wanted else comfort_temp }}"
          cycle: "{{ not boost_wanted }}"

  - id: heating_upstairs_boost
    alias: Upstairs heating boost
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.heating_upstairs_mode
        to: ["boost", "comfort", "eco"]
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.heating_upstairs_mode') in ['boost', 'comfort', 'eco'] }}"
    variables:
      mode: "{{ states('sensor.heating_upstairs_mode') }}"
      temps:
        boost: "{{ states('input_number.landing_thermostat_boost') | float }}"
        comfort: "{{ states('input_number.landing_thermostat_comfort') | float }}"
        eco: "{{ states('input_number.landing_thermostat_eco') | float }}"
    actions:
      - action: logbook.log
        data:
          name: Upstairs heating
          message: "mode={{ mode }} temp={{ temps[mode] }} cycle={{ mode != 'boost' }}"
          # entity_id: "{{ climate }}"
      - action: script.update_climate
        enabled: true
        data:
          climate: landing_thermostat
          temperature: "{{ temps[mode] }}"
          cycle: "{{ mode != 'boost' }}"

  - alias: DHW boost
    id: dhw_boost
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.dhw_boost_active
        to: ["on", "off"]
      - trigger: homeassistant
        event: start
    variables:
      climate: m5atom_dev_hot_water
      min_temp: 30
      boost: "{{ states('input_number.dhw_boost') | float(50) }}"
      legionella: "{{ states('input_number.dhw_legionella') | float(55) }}"
      holiday: "{{ states('input_number.dhw_holiday_temp') | float(40) }}"
      setback: "{{ states('input_number.dhw_setback') | float(0) }}"
      holiday_mode: "{{ is_state('binary_sensor.holiday_mode', 'on') }}"
      boost_temp: >
        {{ holiday if holiday_mode
           else legionella if now().weekday() == 2
           else boost }}
      day_temp: >
        {{ holiday if holiday_mode
           else [boost - setback, min_temp] | max }}
      setpoint: >
        {{ boost_temp if is_state('binary_sensor.dhw_boost_active', 'on')
           else day_temp }}
    actions:
      - action: logbook.log
        data:
          name: DHW boost
          message: >
            boost active: {{ is_state('binary_sensor.dhw_boost_active', 'on') }},
            setpoint: {{ setpoint }},
            trigger: {{ trigger.platform }}
          # entity_id: "{{ climate }}"
      - action: script.update_climate
        enabled: true   # re-enable after testing
        data:
          climate: "{{ climate }}"
          temperature: "{{ setpoint }}"

  - alias: Check Hot water for Ann
    id: check_hot_water_for_ann
    description: Check whether hot water is hot enough for a morning shower!
    triggers:
      - trigger: time
        at: '08:10:00'
    conditions:
      - condition: numeric_state
        entity_id: climate.m5atom_dev_hot_water
        attribute: current_temperature
        below: 47
      - condition: state
        entity_id: binary_sensor.holiday_mode
        state: 'off'
    actions:
      - action: notify.all_devices
        data:
          title: Hot water is low
          message: >-
            Hot water temperature is only
            {{ state_attr("climate.m5atom_dev_hot_water","current_temperature") }}°C
          data:
            tag: dhw_low_temp
            actions:
              - action: DHW_BOOST_START
                title: Boost hot water
              - action: DHW_BOOST_IGNORE
                title: Ignore
    mode: single

  - alias: Handle DHW boost notification action
    id: handle_dhw_boost_notification
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: DHW_BOOST_START
    actions:
      - action: timer.start
        target:
          entity_id: timer.dhw_boost
        data:
          duration: '00:30:00'
    mode: single

script:
  update_climate:
    alias: Update Climate
    description: Set a climate temperature or preset mode, then cycle the thermostat off/on
    icon: mdi:thermostat-auto
    mode: queued
    max: 10
    fields:
      climate:
        description: Entity name without the "climate." prefix, e.g. landing
        required: true
      temperature:
        description: Target temperature
      preset:
        description: Preset mode
    sequence:
      - condition: template
        alias: Check variables are set
        value_template: "{{ climate is defined and (temperature is defined or preset is defined) }}"
      - variables:
          entity: "{{ 'climate.' ~ climate }}"
          target_temp: "{{ temperature | float(none) if temperature is defined else none }}"
          needs_change: >
            {{ (preset is defined and state_attr(entity, 'preset_mode') != preset)
               or (target_temp is not none
                   and state_attr(entity, 'temperature') | float(none) != target_temp) }}
      - alias: Set preset or temperature only if different
        if: "{{ needs_change }}"
        then:
          - choose:
              - conditions: "{{ preset is defined }}"
                sequence:
                  - action: climate.set_preset_mode
                    target:
                      entity_id: "{{ entity }}"
                    data:
                      preset_mode: "{{ preset }}"
              - conditions: "{{ target_temp is not none }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ entity }}"
                    data:
                      temperature: "{{ target_temp }}"
          - delay: "00:00:05"
      - alias: Always cycle off/on
        action: climate.turn_off
        target:
          entity_id: "{{ entity }}"
      - wait_template: "{{ is_state(entity, 'off') }}"
        timeout: "00:00:05"
      - delay: "00:00:05"
      - action: climate.turn_on
        target:
          entity_id: "{{ entity }}"
