script:
  update_climate:
    alias: Update Climate
    description: Set a climate temperature or preset mode
    icon: mdi:thermostat-auto
    mode: queued
    max: 10
    fields:
      climate:
        description: Entity name without the "climate." prefix, e.g. landing
        required: true
      temperature:
        description: Target temperature
      preset:
        description: Preset mode
      cycle:
        description: Turn the thermostat off then on after setting, to cancel an in-progress heat call
        default: false
    sequence:
      - condition: template
        alias: Check variables are set
        value_template: "{{ climate is defined and (temperature is defined or preset is defined) }}"
      - variables:
          entity: "{{ 'climate.' ~ climate }}"
          target_temp: "{{ temperature | float(none) if temperature is defined else none }}"
          do_cycle: "{{ cycle | default(false) | bool }}"
      - condition: template
        alias: Skip if already at the requested setpoint or preset
        value_template: >
          {{ (preset is defined and state_attr(entity, 'preset_mode') != preset)
             or (target_temp is not none
                 and state_attr(entity, 'temperature') | float(none) != target_temp) }}
      - choose:
          - conditions: "{{ preset is defined }}"
            sequence:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ entity }}"
                data:
                  preset_mode: "{{ preset }}"
              - wait_template: "{{ state_attr(entity, 'preset_mode') == preset }}"
                timeout: "00:00:10"
          - conditions: "{{ target_temp is not none }}"
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ entity }}"
                data:
                  temperature: "{{ target_temp }}"
              - wait_template: "{{ state_attr(entity, 'temperature') | float(none) == target_temp }}"
                timeout: "00:00:10"
      - alias: Cycle to cancel an in-progress heat call
        if: "{{ do_cycle }}"
        then:
          - action: climate.turn_off
            target:
              entity_id: "{{ entity }}"
          - wait_template: "{{ is_state(entity, 'off') }}"
            timeout: "00:00:10"
          - delay: "00:00:03"
          - action: climate.turn_on
            target:
              entity_id: "{{ entity }}"
          - wait_template: "{{ not is_state(entity, 'off') }}"
            timeout: "00:00:10"