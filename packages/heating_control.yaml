---
# packages/heating_control.yaml
template:
  - binary_sensor:
      - name: "Octopus power up active"
        unique_id: octopus_power_up_active
        state: "{{ is_state('calendar.octopus_energy_a_281ee75f_octoplus_power_up', 'on') }}"
      - name: "Octopus daytime heating boost active"
        unique_id: octopus_daytime_heating_boost_active
        state: "{{ is_state('binary_sensor.target_timeframes_octopus_energy_import_heating_daytime_boost', 'on') }}"
timer:
  heating_boost:
    name: Heating boost
    duration: "01:00:00"
    restore: true
  dhw_boost:
    name: DHW boost
    duration: "01:00:00"
    restore: true

automation:
  - id: heating_downstairs_boost_new
    alias: Downstairs heating boost new
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.octopus_daytime_heating_boost_active
        to: ["on", "off"]
        for: "00:01:00"
      - trigger: state
        entity_id: binary_sensor.octopus_power_up_active
        to: ["on", "off"]
        for: "00:01:00"
      - trigger: state
        entity_id: timer.heating_boost
        to: ["active", "idle"]
      - trigger: homeassistant
        event: start
    conditions:
      - alias: Skip while the target sensor is unavailable
        condition: template
        value_template: >
          {{ states('binary_sensor.octopus_daytime_heating_boost_active')
             in ['on', 'off'] }}
    variables:
      boost_wanted: >
        {{ is_state('binary_sensor.octopus_daytime_heating_boost_active', 'on')
           or is_state('binary_sensor.octopus_power_up_active', 'on')
           or is_state('timer.heating_boost', 'active') }}
      boost_temp: "{{ states('input_number.downstairs_boost') | float }}"
      comfort_temp: "{{ states('input_number.downstairs_comfort') | float }}"
    actions:
      - action: logbook.log
        data:
          name: Heating boost
          message: >
            wanted={{ boost_wanted }}
            target={{ is_state('binary_sensor.octopus_daytime_heating_boost_active', 'on') }}
            calendar={{ is_state('binary_sensor.octopus_power_up_active', 'on') }}
            timer={{ is_state('timer.heating_boost', 'active') }}
      - action: script.update_climate
        data:
          climate: downstairs
          temperature: "{{ boost_temp if boost_wanted else comfort_temp }}"
          cycle: "{{ not boost_wanted }}"

script:
  update_climate:
    alias: Update Climate
    description: Set a climate temperature or preset mode
    icon: mdi:thermostat-auto
    mode: queued
    max: 10
    fields:
      climate:
        description: Entity name without the "climate." prefix, e.g. landing
        required: true
      temperature:
        description: Target temperature
      preset:
        description: Preset mode
      cycle:
        description: Turn the thermostat off then on after setting, to cancel an in-progress heat call
        default: false
    sequence:
      - condition: template
        alias: Check variables are set
        value_template: "{{ climate is defined and (temperature is defined or preset is defined) }}"
      - variables:
          entity: "{{ 'climate.' ~ climate }}"
          target_temp: "{{ temperature | float(none) if temperature is defined else none }}"
          do_cycle: "{{ cycle | default(false) | bool }}"
      - condition: template
        alias: Skip if already at the requested setpoint or preset
        value_template: >
          {{ (preset is defined and state_attr(entity, 'preset_mode') != preset)
             or (target_temp is not none
                 and state_attr(entity, 'temperature') | float(none) != target_temp) }}
      - choose:
          - conditions: "{{ preset is defined }}"
            sequence:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ entity }}"
                data:
                  preset_mode: "{{ preset }}"
              - wait_template: "{{ state_attr(entity, 'preset_mode') == preset }}"
                timeout: "00:00:10"
          - conditions: "{{ target_temp is not none }}"
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ entity }}"
                data:
                  temperature: "{{ target_temp }}"
              - wait_template: "{{ state_attr(entity, 'temperature') | float(none) == target_temp }}"
                timeout: "00:00:10"
      - alias: Cycle to cancel an in-progress heat call
        if: "{{ do_cycle }}"
        then:
          - action: climate.turn_off
            target:
              entity_id: "{{ entity }}"
          - wait_template: "{{ is_state(entity, 'off') }}"
            timeout: "00:00:10"
          - delay: "00:00:03"
          - action: climate.turn_on
            target:
              entity_id: "{{ entity }}"
          - wait_template: "{{ not is_state(entity, 'off') }}"
            timeout: "00:00:10"
