# ==============================================================================
# PACKAGE: Samsung ASHP Underfloor Cooling Automation & Helpers
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HELPERS (Input Controls for the Dashboard)
# ------------------------------------------------------------------------------
input_boolean:
  cooling_season_enabled:
    name: ASHP Cooling Season Master Switch
    icon: mdi:snowflake-alert

  thermostat_schedule_override:
    name: Thermostat Schedule Override
    icon: mdi:calendar-remove

input_number:
  cooling_min_outdoor_forecast:
    name: Min Outdoor Forecast High
    min: 18.0
    max: 35.0
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:weather-sunny

  cooling_min_indoor_temp:
    name: Min Indoor Temp Threshold
    min: 20.0
    max: 28.0
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:home-thermometer
  
  cooling_stop_solar_threshold:
    name: ASHP Cooling Stop Solar Threshold
    min: 200
    max: 2000
    step: 50
    unit_of_measurement: W
    icon: mdi:solar-power
    
  cooling_stop_solar_duration:
    name: ASHP Cooling Stop Solar Duration
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:clock-outline

# ------------------------------------------------------------------------------
# 2. TEMPLATE SENSORS (The Automated Evaluation Logic)
# ------------------------------------------------------------------------------
template:
  - trigger:
      - platform: time_pattern
        minutes: 55
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
    action:
      - action: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.met_office_sandhutton
        response_variable: daily_data
    binary_sensor:
      - name: ASHP Cooling Allowed Today
        unique_id: ashp_cooling_allowed_today
        icon: mdi:snowflake
        state: >
          {# 1. Check if the master switch is on #}
          {% set master_on = is_state('input_boolean.cooling_season_enabled', 'on') %}

          {# 2. Check if the house is actually warm enough to need it #}
          {% set current_indoor = state_attr('climate.downstairs', 'current_temperature') | float(0) %}

          {% set target_indoor = states('input_number.cooling_min_indoor_temp') | float(0) %}
          {% set indoor_warm = current_indoor >= target_indoor %}

          {# 3. Grab today's maximum temperature from the weather forecast array #}
          {# Loop through the array to find the explicit match for today's date string #}
          {% set today_str = now().strftime('%Y-%m-%d') %}
          {% set today_forecast = daily_data['weather.met_office_sandhutton'].forecast | selectattr('datetime', 'search', today_str) | first %}

          {# Fallback to index 0 if the date filter returns empty #}
          {% if today_forecast is not none %}
            {% set forecast_high = today_forecast.temperature | float(0) %}
          {% else %}
            {% set forecast_high = daily_data['weather.met_office_sandhutton'].forecast[0].temperature | float(0) %}
          {% endif %}

          {% set target_outdoor = states('input_number.cooling_min_outdoor_forecast') | float(0) %}
          {% set forecast_hot = forecast_high >= target_outdoor %}

          {# 4. NEW DEW POINT SAFETY CHECK #}
          {# Ensures that downstairs humidity levels won't cause condensation on the slab #}
          {% set dew_point_safe = states('sensor.thermal_comfort_dew_point') | float(0) <= 15.5 %}

          {# All four criteria must be true to allow cooling #}
          {{ master_on and indoor_warm and forecast_hot and dew_point_safe }}


# ------------------------------------------------------------------------------
# 3. AUTOMATIONS (Startup Execution)
# ------------------------------------------------------------------------------
automation:
- alias: 'Climate: Automated Downstairs Underfloor Cooling Start'
  id: climate_automated_downstairs_underfloor_cooling_start
  description: Evaluates parameters in the morning to safely pre-charge the slab.
  triggers:
  - at: 09:00:00
    trigger: time
  conditions:
  - condition: state
    entity_id: binary_sensor.ashp_cooling_allowed_today
    state: 'on'
  actions:
  # 1. Flip FSV parameters 2901/2 to 0 (Disabling heating logic/interlocks)
  - target:
      entity_id:
        - select.m5atom_dev_external_thermostat_application_wl1
        - select.m5atom_dev_external_thermostat_application_wl2
    data:
      option: None
    action: select.select_option
  - target:
      entity_id: input_boolean.thermostat_schedule_override
    action: input_boolean.turn_on
  - target:
      entity_id: climate.downstairs
    data:
      temperature: 30
    action: climate.set_temperature
  - target:
      entity_id: climate.heating_ashp_samsung_heat_pump
    data:
      hvac_mode: cool
    action: climate.set_hvac_mode
  - data:
      title: ASHP Cooling Active
      message: All comfort parameters met. Pre-charging the downstairs slab at full
        hydraulic capacity.
    action: notify.persistent_notification
  mode: single
- alias: "Climate: Automated Downstairs Underfloor Cooling Stop (Solar)"
  id: climate_automated_downstairs_underfloor_cooling_stop_solar
  description: Shuts down cooling when solar generation drops off at the end of the
    day.
  triggers:
  - entity_id:
    - sensor.solax_pv_total_power
    below: input_number.cooling_stop_solar_threshold
    for:
      minutes: "{{ states('input_number.cooling_stop_solar_duration') | int }}"
    trigger: numeric_state
  - at: '19:00:00'
    trigger: time
  - trigger: state
    entity_id: binary_sensor.ashp_cooling_allowed_today
    to: 'off'
    for:
      seconds: 10

  conditions:
  - condition: state
    entity_id: climate.heating_ashp_samsung_heat_pump
    state:
    - cool
  actions:
  - target:
      entity_id: climate.heating_ashp_samsung_heat_pump
    data:
      hvac_mode: heat
    action: climate.set_hvac_mode
  - delay:
      seconds: 5
  - target:
      entity_id: climate.heating_ashp_samsung_heat_pump
    data:
      hvac_mode: 'off'
    action: climate.set_hvac_mode
  - target:
      entity_id: input_boolean.thermostat_schedule_override
    action: input_boolean.turn_off
  - target:
      entity_id: climate.downstairs
    data:
      temperature: "{{ states('input_number.downstairs_eco') }}"
    action: climate.set_temperature
    # 1. Flip FSV parameters 2901/2 to 1 (Enabling heating logic/interlocks)
  - target:
      entity_id:
        - select.m5atom_dev_external_thermostat_application_wl1
        - select.m5atom_dev_external_thermostat_application_wl2
    data:
      option: 'Thermostat On/Off + WL #1'
    action: select.select_option
  - data:
      title: ASHP Cooling Stopped
      message: Solar generation has dropped below threshold. Cooling cycle completed,
        slab is charged.
    action: notify.persistent_notification
  mode: single
