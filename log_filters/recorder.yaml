---
homeassistant.components.recorder.db_schema:
  # predbat and predheat are generating large state attributes which can cause database performance issues. These are being filtered out to avoid performance issues.
  - 'State attributes for (?:predbat|predheat)\.[^ ]+ exceed maximum size of 16384 bytes'
  - 'State attributes for binary_sensor.predbat_octopus_a_281ee75f_intelligent_dispatch exceed maximum size of 16384 bytes. This can cause database performance issues; Attributes will not be stored'
  # Disabled device entities
  - 'State attributes for sensor.disabled_device_entities exceed maximum size of 16384 bytes. This can cause database performance issues; Attributes will not be stored'
