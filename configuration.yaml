---
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Text to speech
tts:
  - platform: google_translate

homeassistant:
  allowlist_external_dirs:
    - /config
  packages: !include_dir_named packages

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

climate: !include_dir_merge_list entities/climates
input_number: !include_dir_merge_named entities/input_numbers
template: !include_dir_merge_list entities/templates
sensor: !include_dir_merge_list entities/sensors
utility_meter: !include_dir_merge_named entities/utility_meters