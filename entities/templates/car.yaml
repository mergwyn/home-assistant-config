- sensor:
  - name: Car Charging Now
    unique_id: template_sensor_car_charging_now
    state: >
      {% set status = states('sensor.myenergi_zappi_24876502_status') %}
      {% set plug = states('sensor.myenergi_zappi_24876502_plug_status') %}
      {% if (status == "Charging") -%}
        on
      {%- else -%}
        off
      {%- endif %}