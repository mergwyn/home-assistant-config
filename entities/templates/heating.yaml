# ---
# templates:
#
- binary_sensor:
  - name: Upstairs Heating Active
    description: |
      Indicates if the upstairs (landing) heating is actively heating while downstairs is not
      by checking the hvac_action of both thermostats.
    unique_id: template_binary_sensor_upstairs_heating_active
    icon: mdi:toggle-switch
    availability: >
      {{
      states("climate.landing_thermostat") != "unavailable"
      and states("climate.landing_thermostat") != "unknown"
      and states("climate.downstairs") != "unavailable"
      and states("climate.downstairs") != "unknown"
      }}
    state: >
      {{ state_attr('climate.landing_thermostat', 'hvac_action') == 'heating'
      and state_attr('climate.downstairs', 'hvac_action') == 'idle' }}

- sensor:
  - name: ASHP Total Energy Consumed Adjusted
    unique_id: template_sensor_total_energy_consumed_adjusted
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: kWh
    availability: >
      {{ states("sensor.ashp_clamp_energy") != "unavailable"
      and states("sensor.ashp_clamp_energy") != "unknown" }}
    state: >
      {{ (states('sensor.ashp_clamp_energy') | float(0) - 604.930 + 13254.418) | float(0) }}


- sensor:
  - name: ASHP COP - Daily Clamp
    unique_id: template_sensor_cop_daily_clamp
    state_class: measurement
    icon: mdi:chart-bar
    state: >
      {% set generated = states('sensor.m5atom_dev_daily_heat_generated') | float(0) %}
      {% set consumed = states('sensor.ashp_daily_energy_consumed_clamp') | float(0) %}
      {% if generated == 0 or consumed == 0 -%}{{ float(0) }}{% else -%}
      {{ [generated / consumed, 8] | min | round(2) | float(0)}}
      {% endif -%}

- sensor:
  - name: ASHP COP - Last Hour Clamp
    unique_id: template_sensor_cop_last_hour
    state_class: measurement
    icon: mdi:chart-bar
    state: >
      {% set generated = states('sensor.ashp_last_hour_heat_produced_esp') | float(0) %}
      {% set consumed = states('sensor.ashp_last_hour_energy_consumed_clamp') | float(0) %}
      {% if generated == 0 or consumed == 0 -%}0{% else -%}
      {{ [generated / consumed, 8] | min | round(2) | float(0)}}
      {% endif -%}

- sensor:
  - name: ASHP COP - Last Minute Clamp
    unique_id: template_sensor_cop_last_min
    state_class: measurement
    icon: mdi:chart-bar
    state: >
      {% set generated = states('sensor.m5atom_dev_last_minute_heat_generated') | float(0) %}
      {% set consumed = states('sensor.ashp_power_consumed_last_minute_clamp') | float(0) %}
      {% if generated == 0 or consumed == 0 -%}0{% else -%}
      {{ [generated / consumed, 8] | min | round(2) | float(0)}}
      {% endif -%}

- sensor:
  - name: ASHP COP - Total
    unique_id: template_sensor_cop_total
    state_class: measurement
    icon: mdi:chart-bar
    state: >
      {% set generated = states('sensor.m5atom_dev_total_produced_energy') | float(0) %}
      {% set consumed = states('sensor.ashp_total_energy_consumed_adjusted') | float(0) %}
      {% if generated == 0 or consumed == 0 -%}0{% else -%}
      {{ [generated / consumed, 8] | min | round(2) | float(0)}}
      {% endif -%}

