---

  - platform: generic_thermostat
    name: Solar Heater
    heater: switch.heater
    target_sensor: sensor.solar_battery_rack_temperature
    target_temp: 12
    cold_tolerance: 1.0
    hot_tolerance: 0
    initial_hvac_mode: heat
    min_temp: 0
    max_temp: 20
    target_temp_step: 0.5
    ac_mode: false # Set to true for air conditioning
    unique_id: climate.solar_heater
