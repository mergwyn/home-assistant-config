set_dhw_temperature:
  sequence:
  - enabled: false
    alias: Notify that the hot water is being turned on
    action: notify.notify
    data:
      message: 'Setting hot water to {{ temperature }} ({{ mode }})

        '
  - action: select.select_option
    metadata: {}
    data:
      option: '{{ mode }}'
    target:
      entity_id: select.samsung_ashp_dhw_mode
    enabled: true
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: '{{ temperature }}'
    target:
      entity_id: climate.samsung_ashp_hot_water
  - action: climate.turn_off
    target:
      entity_id: climate.samsung_ashp_hot_water
    data: {}
  - wait_template: '{{ is_state(''climate.samsung_ashp_hot_water'', ''off'') }}'
    timeout: 00:00:05
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: climate.turn_on
    target:
      entity_id: climate.samsung_ashp_hot_water
    data: {}
  fields:
    temperature:
      description: The temperature to set the hot water to
      example: 48
      default: 48
  variables:
    mode: Standard
  description: ''
  icon: mdi:water
  alias: Set DHW Temperature
set_climate_temperature:
  sequence:
  - enabled: false
    alias: Notify that the thermostat is being turned on
    action: notify.notify
    data:
      message: 'Setting thermostat to {{ temperature }} ({{ mode }})

        '
  - action: select.select_option
    metadata: {}
    data:
      option: '{{ mode }}'
    target:
      entity_id: '{{ "climate." ~ climate }}

        '
    enabled: true
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: '{{ temperature }}'
    target:
      entity_id: '{{ "climate." ~ climate }}

        '
  - action: climate.turn_off
    target:
      entity_id: '{{ "climate." ~ climate }}

        '
    data: {}
  - wait_template: '{{ is_state(''climate.'' ~ climate, ''off'') }}'
    timeout: 00:00:05
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: climate.turn_on
    target:
      entity_id: '{{ "climate." ~ climate }}

        '
    data: {}
  fields:
    temperature:
      description: The temperature to set the thermostat to
      example: 48
      default: 48
  variables:
    mode: Standard
    climate: m5atom_dev_hot_water
  description: ''
  icon: mdi:thermostat-auto
  alias: Set Climate Temperature
set_climate:
  sequence:
  - condition: template
    alias: Check variables are set
    value_template: '{{ (temperature is defined or preset is defined) and climate
      is defined }}'
    enabled: true
  - alias: Notify that the thermostat is being turned on
    action: notify.notify
    data:
      message: 'Setting thermostat to {{ temperature }} {{ preset }}

        '
    enabled: false
  - alias: Set preset or temperature
    choose:
    - conditions:
      - condition: template
        value_template: '{{ preset is defined }}'
      sequence:
      - alias: Setting preset
        action: climate.set_preset_mode
        metadata: {}
        data:
          preset_mode: '{{ preset }}'
        target:
          entity_id: '{{ "climate." ~ climate }}

            '
        enabled: true
    - conditions:
      - condition: template
        value_template: '{{ temperature is defined }}'
      sequence:
      - alias: Setting temperature
        action: climate.set_temperature
        metadata: {}
        data:
          temperature: '{{ temperature }}'
        target:
          entity_id: '{{ "climate." ~ climate }}

            '
  - action: climate.turn_off
    target:
      entity_id: '{{ "climate." ~ climate }}

        '
    data: {}
  - wait_template: '{{ is_state(''climate.'' ~ climate, ''off'') }}'
    timeout: 00:00:05
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: climate.turn_on
    target:
      entity_id: '{{ "climate." ~ climate }}

        '
    data: {}
  fields:
    temperature:
      description: Temperature
    preset:
      description: preset
  description: Set a climate temperature or preset mode
  icon: mdi:thermostat-auto
  alias: Set Climate
calibrate_thermostat_from_external_sensor:
  alias: Calibrate thermostat from external sensor
  description: ''
  fields:
    thermostat:
      description: eg climate.landing_thermostat
    calibration:
      description: eg number.landing_thermostat_local_temperature_calibration
    sensor_extern:
      description: eg sensor.main_bedroom_temperature
  trace:
    stored_traces: 20
  sequence:
  - action: number.set_value
    metadata: {}
    data:
      entity_id: '{{ calibration }}'
      value: "{% set s_calibration =  calibration  %}\n{% set s_sensor_extern = sensor_extern
        \ %}\n{% set s_thermostat = thermostat %}\n{# Get external temperature #}\n{%
        set extern = states(s_sensor_extern) | float %}\n{# Get current calibration
        settings #}\n{% set cal_curr = states(s_calibration) | float %}\n{% set cal_min
        = state_attr(s_calibration, \"min\") | float %}  \n{% set cal_max = state_attr(s_calibration,
        \"max\") | float %} \n{% set cal_step = state_attr(s_calibration, \"step\")
        | float %}\n{# Get thermostat temperature and setpoint #}\n{% set thermo_cur
        = state_attr(s_thermostat, \"current_temperature\") | float %}\n{% set thermo_setpoint
        = state_attr(s_thermostat, \"temperature\") or 0 | float %}\n{# Current not
        rounded offset #}\n{% set cal_new = extern - thermo_cur %}\n{# Adjust value
        before rounding, based on above or bellow the setpoint #}\n{% set expected_new
        = thermo_cur + cal_new %}\n{% if expected_new >= thermo_setpoint %}\n{% set
        cal_new = cal_new + cal_step / 2 %}  \n{% else %}\n{% set cal_new = cal_new
        - cal_step / 2 %}\n{% endif %}\n{# New rounded setpoint #}\n{% set cal_new
        = ( cal_new / cal_step ) | round * cal_step + cal_curr %}\n{# min/max adjusted
        return value #}\n{{ min(max(cal_new, cal_min), cal_max) }}"
